name: Compilar EXE Windows

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compilar ejecutable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ConvertidorActasViales --hidden-import=pythoncom --hidden-import=pywintypes --hidden-import=win32timezone --collect-submodules win32com main.py
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: ConvertidorActasViales-Windows
          path: dist/ConvertidorActasViales.exe
          if-no-files-found: error
